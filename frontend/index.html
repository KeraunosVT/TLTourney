<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Throne &amp; Liberty Tournament Series</title>
    <meta
      name="description"
      content="Throne &amp; Liberty Tournament Series — sign up for the draft, follow the bracket, and see the record."
    />

    <!-- Favicons. The SVG is listed first and wins in every browser that
         supports it, staying crisp at any size and costing 18KB rather than 89.
         The 512 PNG is the declared icon for everything else and is what
         Android and the app-install prompt use; the 64 is there so a 16px tab
         icon isn't downscaled from half a megapixel. -->
    <link rel="icon" type="image/svg+xml" href="/tl-sigil-mark.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/tl-sigil-mark-512.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/tl-sigil-favicon-64.png" />
    <link rel="apple-touch-icon" href="/tl-sigil-mark-512.png" />

    <!-- The browser chrome around the page, so the address bar on mobile
         matches the ground the sigil sits on rather than defaulting to white. -->
    <meta name="theme-color" content="#0B0A0C" />

    <!-- Link previews in Discord, which is where every one of these links is
         going to be posted. -->
    <meta property="og:title" content="Throne &amp; Liberty Tournament Series" />
    <meta
      property="og:description"
      content="Sign up for the draft, follow the bracket, and see the record."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/tl-sigil-mark-512.png" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
